# dsh-hypatia-auto-memory bundle patch: inserts the plugin row into the
# profile roster over dsh-base. Installed with
#   dsh plugin --profile <name> add dsh-hypatia-auto-memory          (registry)
#   dsh plugin --profile <name> add link:/path/to/dsh-hypatia-auto-memory
#
# Behavior is configured through the `hypatia-auto-memory` settings namespace
# (settings.yaml / Web settings), NOT through this config block. The only
# cordis-level knobs are the bundled skill:
#
#   - id: hypatia-auto-memory
#     config:
#       skills: true             # register hypatia-memory + hypatia + hypatia-dream
#       skillsDir: /abs/path     # override the packaged skills/ directory
#
# This plugin replaces dsh-hypatia: it carries that plugin's skills and its
# auto-approval for the agent's own bash `hypatia` calls. Remove dsh-hypatia
# from the profile rather than running both.
- insert:
    - id: hypatia-auto-memory
      name: dsh-hypatia-auto-memory
